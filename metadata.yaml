name: astrbot_plugin_mc_bridge
display_name: MC服务器桥接
desc: 支持多台本地/远程 Minecraft(Paper/Spigot) 服务器接入，将玩家聊天记录为按服隔离的虚拟群聊会话；正版验证服可基于正版UUID跨服合并记忆/印象/上下文。支持同步到 memory_companion 与 交互印象(impression) 插件。管理员可通过 AstrBot 自然语言 LLM工具 或 /mc 指令执行 MC 管理/操作/查询/运维四类命令。支持桥接HTTP与RCON双通道回传 tellraw。
